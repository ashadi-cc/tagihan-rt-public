# version: "3.8"
services: 
  #db service with persistent storage
  db:
    image: mariadb:latest
    container_name: rt4-db
    restart: unless-stopped
    environment: 
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=dev-rt-4-01
      - MYSQL_USER=rt4user
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes: 
      - dbdata:/var/lib/mysql
    networks:
      - rt4-network
    # ports: 
    #   - "3307:3306"
      
  #app service built from Dockerfile
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rt4-app
    restart: unless-stopped
    tty: true
    environment: 
      - SERVICE_NAME=app
      - SERVICE_TAGS=dev
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=dev-rt-4-01
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
    working_dir: /var/www
    volumes: 
      - ./:/var/www
      - ./docker-res/php/local.ini:/usr/local/etc/php/8.3/fpm/conf.d/local.ini
    networks:
      - rt4-network
    depends_on:
      - db

  #nginx web server
  webserver:
    image: nginx:alpine
    container_name: rt4-webserver
    restart: unless-stopped
    tty: true
    ports: 
      - "127.0.0.1:8000:80"
    volumes: 
      - ./:/var/www
      - ./docker-res/nginx:/etc/nginx/conf.d
    networks:
      - rt4-network
    depends_on: 
      - db
      - app

  #adminer - database management
  adminer:
    image: adminer:latest
    container_name: rt4-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DESIGN=pepa-linha
    networks:
      - rt4-network
    depends_on:
      - db

  #qris api service
  qrisapi:
    image: node:18
    container_name: rt4-qrisapi
    restart: unless-stopped
    working_dir: /app
    command: npm run api
    ports:
      - "127.0.0.1:54100:54100"
    volumes:
      - ../qris-dynamic-generator:/app
    networks:
      - rt4-network

#Docker Networks
networks:
  rt4-network:
    driver: bridge

#Persistent Volumes
volumes:
  dbdata:
    driver: local
